  <section>

        <!-- HOW TO USE A REAL PHOTO:
             1. Put the image in an "images" folder inside dj-aron-site
             2. Replace the <div class="ph">...</div> line with:
                <img src="images/your-photo.jpg" alt="Describe the photo">
             The alt text is read aloud for people who can't see the image. -->

        <figure class="tile wide">
          <div class="ph">Photo: DJ Aron at the decks</div>
